<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" font-family="Arial, sans-serif" font-size="14">
  <rect width="600" height="270" fill="#fff"/>
  <g fill="none" stroke="#333" stroke-width="2">
    <!-- RS: valid from 110 to 470 -->
    <path d="M80 40 H110 L120 60 H460 L470 40 H560 M80 60 H110 L120 40 H460 L470 60 H560"/>
    <!-- R/W: low from 120 to 470 -->
    <path d="M80 90 H110 L120 115 H460 L470 90 H560"/>
    <!-- E: high from 200 to 380 -->
    <path d="M80 175 H190 L200 150 H370 L380 175 H560"/>
    <!-- DB: valid 260..420 -->
    <path d="M80 205 H250 L262 225 H408 L420 205 H560 M80 225 H250 L262 205 H408 L420 225 H560"/>
  </g>
  <g fill="#e8f0fe"><path d="M262 207 H408 L418 215 L408 223 H262 L252 215 Z"/></g>
  <g fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3">
    <path d="M375 25 V240"/>
  </g>
  <g fill="#333">
    <text x="70" y="55" text-anchor="end" font-weight="bold">RS</text>
    <text x="70" y="108" text-anchor="end" font-weight="bold">R/W</text>
    <text x="70" y="168" text-anchor="end" font-weight="bold">E</text>
    <text x="70" y="220" text-anchor="end" font-weight="bold">DB7~4</text>
    <text x="290" y="35" text-anchor="middle" font-size="12" fill="#666">0: command / 1: data</text>
    <text x="290" y="132" text-anchor="middle" font-size="12" fill="#666">LOW = write</text>
    <text x="335" y="219" text-anchor="middle" font-size="12">Valid Data</text>
    <text x="375" y="255" text-anchor="middle" font-size="12" fill="#c0392b">E 하강 엣지에서 데이터 반영</text>
    <text x="1" y="268" font-size="11" fill="#999"> </text>
  </g>
</svg>
