<svg xmlns="http://www.w3.org/2000/svg" width="640" height="245" viewBox="0 0 640 245" font-family="Arial, sans-serif" font-size="14">
  <rect width="640" height="245" fill="#fff"/>
  <!-- y: SDA high 50 / low 90 ; SCL high 140 / low 180 -->
  <g fill="none" stroke-width="2.5">
    <!-- SDA -->
    <path stroke="#c0392b" d="M60 50 H120 L135 90 H215 L225 50 H325 L335 90 H445 L455 90 H500 L515 50 H600"/>
    <!-- SCL -->
    <path stroke="#1f4e79" d="M60 140 H160 L170 180 H240 L250 140 H300 L310 180 H350 L360 140 H410 L420 180 H470 L480 140 H600"/>
  </g>
  <g fill="none" stroke="#999" stroke-dasharray="4 4" stroke-width="1">
    <path d="M128 30 V195 M508 30 V195"/>
    <path d="M220 30 V195 M330 30 V195 M330 30 V195 M450 30 V195"/>
  </g>
  <g fill="#333">
    <text x="50" y="55" text-anchor="end" fill="#c0392b" font-weight="bold">SDA</text>
    <text x="50" y="145" text-anchor="end" fill="#1f4e79" font-weight="bold">SCL</text>
    <text x="128" y="22" text-anchor="middle" font-weight="bold">START</text>
    <text x="275" y="22" text-anchor="middle">bit = 1</text>
    <text x="390" y="22" text-anchor="middle">bit = 0</text>
    <text x="508" y="22" text-anchor="middle" font-weight="bold">STOP</text>
    <text x="128" y="212" text-anchor="middle" font-size="12" fill="#666">SCL H, SDA H→L</text>
    <text x="330" y="235" text-anchor="middle" font-size="12" fill="#666">SCL이 H인 동안 SDA 값을 읽음 (SDA는 SCL이 L일 때만 바뀜)</text>
    <text x="508" y="212" text-anchor="middle" font-size="12" fill="#666">SCL H, SDA L→H</text>
  </g>
</svg>
